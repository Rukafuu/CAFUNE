# Controle para EXP-002. Mantém o CAFUNE-mini equivalente em capacidade,
# tokenização, dados e avaliação; remove somente a SSA.

[model]
name = "mha-baseline-7m"
vocab_size = 1999
seq_len = 128
d_model = 256
n_heads = 8
n_layers = 8
# Ajuste de 1024 -> 960 compensa as matrizes de atenção extras do MHA-only.
# A contagem fica em 7.071.232, somente 512 abaixo do híbrido (0,007%).
d_ff = 960
dropout = 0.1
linear_mode = "float32"
attention_mode = "mha"

[tokenizer]
type = "sentencepiece_bpe"
model = "python/cafune_spm.model"
vocab = "python/vocab_spm.json"
config = "python/spm_config.json"
dataset = "python/dataset_tokens.json"
pad_id = 0
unk_id = 1
bos_id = 2
eos_id = 3
mask_id = 4

[data]
splits = "python/dataset_splits.json"
train_ratio = 0.90
validation_ratio = 0.05
test_ratio = 0.05
split_seed = "cafune-v1"

[experiment]
purpose = "parameter_matched_mha_control_for_ssa_ablation"
parameters = 7071232
parameter_difference_from_cafune_mini = -512
