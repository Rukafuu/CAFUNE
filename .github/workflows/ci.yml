name: CAFUNE CI

on:
  push:
  pull_request:
    branches: [main]

# Uma execução por branch/PR basta: não há treinamento nem artefatos a preservar.
concurrency:
  group: cafune-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    name: Python contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r python/requirements.txt pytest
      - name: Audit research contract
        run: python python/verify_research.py
      - name: Run Python tests
        run: python -m pytest python/tests -q

  julia-smoke:
    name: Julia smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Instantiate Julia project
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate()'
      - name: Run canonical smoke test
        run: julia --project=julia julia/smoke_test.jl
      - name: Run CAFUNE-mini training sanity check
        run: julia --project=julia julia/main_training.jl --config config/experiments/cafune-mini.toml --sanity
      - name: Run MHA baseline training sanity check
        run: julia --project=julia julia/main_training.jl --config config/experiments/mha-baseline.toml --sanity
